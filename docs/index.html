  if (s === 'musculacao') return [['Volume', volStr(a.volume)], ['Séries', String((a.sets || []).length)], ['Duração', hms(a.duration)]];
  if (s === 'corrida') return [['Distância', fmt((a.distance || 0) / 1000, 2) + ' km'], ['Tempo', hms(a.duration)], ['Pace', paceOf(a.duration, a.distance) + '/km']];
  if (s === 'ciclismo') return [['Distância', fmt((a.distance || 0) / 1000, 1) + ' km'], ['Tempo', hms(a.duration)], ['Vel. média', fmt((a.distance || 0) / Math.max(1, a.duration) * 3.6, 1) + ' km/h']];
  if (s === 'natacao') return [['Distância', fmt(a.distance || 0) + ' m'], ['Voltas', String(a.laps || 0)], ['Tempo', hms(a.duration)]];
  if (s === 'boxe') return [['Rounds', String(a.rounds || 0)], ['Duração', hms(a.duration)], ['Tipo', a.title || 'Treino']];
  if (s === 'futebol') return [['Placar', `${a.scoreFor ?? 0} × ${a.scoreAgainst ?? 0}`], ['Gols', String(a.goals || 0)], ['Assist.', String(a.assists || 0)]];
  return [['Repetições', String(a.reps || 0)], ['Blocos', String((a.blocks || []).length)], ['Duração', hms(a.duration)]];
};

/* Estatísticas que vão para publicações (respeita 'mostrar cargas') */
const publicStats = a => { const s = postStats(a); if (a.sport === 'musculacao' && !((API.me && API.me.privacy) || {}).showWeight) s[0] = ['Exercícios', String(new Set((a.sets || []).map(x => x.ex)).size || '—')]; return s; };

/* ---------------- API do app ---------------- */
const API = (() => {
  let D = null, AU = null, mode = 'none';
  const st = { me: null, acts: [], workouts: [], following: new Set(), joined: [], liked: new Set(), imgCache: {} };
  const uid = () => st.me && st.me.id;
  const strip = o => { const r = {}; for (const [k, v] of Object.entries(o)) if (v !== undefined) r[k] = v; return r; };
  const normHandle = h => (h || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9._]/g, '').replace(/^\.+|\.+$/g, '').slice(0, 24);

  async function init() {
    const local = location.protocol === 'file:' || (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]local=1/.test(location.search));

  /* ---- sessão ---- */
  async function loadSession(u) {
    st.me = null; st.acts = []; st.workouts = []; st.following = new Set(); st.joined = []; st.liked = new Set();
    if (!u) return null;
    let p = await D.get('users/' + u.uid);

    if (p) await Promise.all([loadActs(), loadWorkouts(), loadFollowing(), loadJoined()]);

  }
  async function loadActs() { st.acts = await D.query(`users/${uid()}/activities`, { order: ['startedAt', 'desc'], limit: 1000 }); }
  async function loadWorkouts() { st.workouts = await D.query(`users/${uid()}/workouts`, { order: ['ts', 'asc'], limit: 50 }); }
  async function loadFollowing() { const r = await D.query(`users/${uid()}/following`, { limit: 500 }); st.following = new Set(r.map(x => x.id)); }
  async function loadJoined() { st.joined = (await D.query(`users/${uid()}/joined`, { limit: 100 })).map(x => x.id); }

  /* ---- perfil ---- */
  async function createProfile({ name, handle, sports, goals, level }) {
    const h = normHandle(handle) || normHandle(name) || 'atleta';
    let hh = h; for (let i = 0; i < 6; i++) { const ex = await D.get('handles/' + hh); if (!ex) break; hh = h + Math.floor(Math.random() * 900 + 100); }
    await D.create('handles/' + hh, { uid: uid() });
    const prof = { name: name.trim(), handle: hh, nameLower: name.trim().toLowerCase(), email: st.me.email || '', sports, goals, level: level || 'Intermediário', bio: '', avatar: null, private: false,
      privacy: { hideRouteEnds: true, showWeight: false }, weekly: {}, followersCount: 0, followingCount: 0, postsCount: 0, createdAt: Date.now() };
    await D.set('users/' + uid(), prof, false); st.me = { id: uid(), ...prof }; return st.me;
  }
  async function updateProfile(patch) {
    if (patch.handle !== undefined) { const h = normHandle(patch.handle); if (!h) throw new Error('Usuário inválido'); if (h !== st.me.handle) { const ex = await D.get('handles/' + h); if (ex && ex.uid !== uid()) throw new Error('Esse @ já está em uso.'); await D.create('handles/' + h, { uid: uid() }); await D.del('handles/' + st.me.handle).catch(() => {}); } patch.handle = h; }
    if (patch.name) patch.nameLower = patch.name.toLowerCase();
    await D.set('users/' + uid(), strip(patch)); Object.assign(st.me, patch); return st.me;
  }
  const getUser = id => id === uid() ? Promise.resolve(st.me) : D.get('users/' + id);

  /* ---- imagens (comprimidas, guardadas no Firestore) ---- */
  async function putImage(dataUrl) { const id = await D.add('images', { owner: uid(), data: dataUrl, ts: Date.now() }); st.imgCache[id] = dataUrl; return id; }
  async function getImage(id) { if (!id) return null; if (st.imgCache[id]) return st.imgCache[id]; const d = await D.get('images/' + id); const v = d ? d.data : null; st.imgCache[id] = v; return v; }

  /* ---- atividades ---- */
  async function addActivity(a) {
    const doc = strip({ ...a, uid: uid(), ts: Date.now() }); const id = await D.add(`users/${uid()}/activities`, doc);
    const full = { id, ...doc }; st.acts.unshift(full); st.acts.sort((x, y) => y.startedAt - x.startedAt);
    await syncChallenges(a.sport).catch(() => {}); return full;
  }
  async function removeActivity(id) { await D.del(`users/${uid()}/activities/${id}`); st.acts = st.acts.filter(a => a.id !== id); await syncChallenges().catch(() => {}); }
  const activitiesOf = async id => id === uid() ? st.acts : D.query(`users/${id}/activities`, { order: ['startedAt', 'desc'], limit: 200 });

  /* ---- fichas ---- */
  async function saveWorkout(w) { const data = strip({ name: w.name, focus: w.focus || '', days: w.days || [], exercises: w.exercises || [], cardio: w.cardio && w.cardio.name ? { name: w.cardio.name, min: w.cardio.min || 20 } : null, ts: w.ts || Date.now() });
    if (w.id) { await D.set(`users/${uid()}/workouts/${w.id}`, data); const i = st.workouts.findIndex(x => x.id === w.id); st.workouts[i] = { id: w.id, ...data }; return st.workouts[i]; }
    const id = await D.add(`users/${uid()}/workouts`, data); const n = { id, ...data }; st.workouts.push(n); return n; }
  async function removeWorkout(id) { await D.del(`users/${uid()}/workouts/${id}`); st.workouts = st.workouts.filter(w => w.id !== id); }

  /* ---- posts, curtidas, comentários ---- */
  async function createPost({ sport, text, image, activity }) {
    const imageId = image ? await putImage(image) : null;
    const doc = strip({ authorId: uid(), author: { name: st.me.name, handle: st.me.handle, avatar: st.me.avatar || null }, sport, text: (text || '').slice(0, 2000), imageId, activity: activity || null,
      visibility: st.me.private ? 'followers' : 'public', ts: Date.now(), likeCount: 0, commentCount: 0 });
    const id = await D.add('posts', doc); await D.set('users/' + uid(), { postsCount: INC(1) }); st.me.postsCount = (st.me.postsCount || 0) + 1; return { id, ...doc };
  }
  async function feed({ sport = 'all', scope = 'all', after = null } = {}) {
    // A comunidade mostra só os esportes que a pessoa escolheu
    const mine = (st.me && st.me.sports && st.me.sports.length ? st.me.sports : null);
    const sp = sport !== 'all' ? [['sport', '==', sport]] : mine && mine.length < 7 ? [['sport', 'in', mine.slice(0, 10)]] : [];
    let rows;
    if (scope === 'following') { const ids = [...st.following, uid()].slice(0, 30);
      rows = await D.query('posts', { where: [['authorId', 'in', ids], ['visibility', '==', 'public'], ...(sport !== 'all' ? sp : [])], order: ['ts', 'desc'], limit: 30, after });
      if (sport === 'all' && mine) rows = rows.filter(p => mine.includes(p.sport)); }
    else rows = await D.query('posts', { where: [['visibility', '==', 'public'], ...sp], order: ['ts', 'desc'], limit: 20, after });
    await markLiked(rows); return rows;
  }
  async function postsBy(id) { const where = [['authorId', '==', id]]; if (id !== uid()) where.push(['visibility', '==', 'public']); const rows = await D.query('posts', { where, order: ['ts', 'desc'], limit: 30 }); await markLiked(rows); return rows; }
  async function setPostsVisibility(v) { const rows = await D.query('posts', { where: [['authorId', '==', uid()]], limit: 500 }); for (const r of rows) if (r.visibility !== v) await D.update('posts/' + r.id, { visibility: v }).catch(() => {}); }

  async function like(p) { await D.create(`posts/${p.id}/likes/${uid()}`, { ts: Date.now() }); await D.update('posts/' + p.id, { likeCount: INC(1) }); st.liked.add(p.id); if (p.authorId !== uid()) notify(p.authorId, { type: 'like', postId: p.id }); }
  async function unlike(p) { await D.del(`posts/${p.id}/likes/${uid()}`); await D.update('posts/' + p.id, { likeCount: INC(-1) }); st.liked.delete(p.id); }
  async function comments(pid) { return D.query(`posts/${pid}/comments`, { order: ['ts', 'asc'], limit: 100 }); }
  async function comment(p, text) { const doc = { uid: uid(), name: st.me.name, handle: st.me.handle, avatar: st.me.avatar || null, text: text.slice(0, 600), ts: Date.now() };
    const id = await D.add(`posts/${p.id}/comments`, doc); await D.update('posts/' + p.id, { commentCount: INC(1) }); if (p.authorId !== uid()) notify(p.authorId, { type: 'comment', postId: p.id, text: doc.text.slice(0, 80) }); return { id, ...doc }; }
  async function removePost(p) { await D.del('posts/' + p.id); if (p.imageId) D.del('images/' + p.imageId).catch(() => {}); await D.set('users/' + uid(), { postsCount: INC(-1) }); }

  /* ---- seguidores ---- */
  async function follow(id) { await D.batch([['set', `users/${uid()}/following/${id}`, { ts: Date.now() }], ['set', `users/${id}/followers/${uid()}`, { ts: Date.now() }], ['update', 'users/' + uid(), { followingCount: INC(1) }], ['update', 'users/' + id, { followersCount: INC(1) }]]);
    st.following.add(id); st.me.followingCount = (st.me.followingCount || 0) + 1; notify(id, { type: 'follow' }); }
  async function unfollow(id) { await D.batch([['del', `users/${uid()}/following/${id}`], ['del', `users/${id}/followers/${uid()}`], ['update', 'users/' + uid(), { followingCount: INC(-1) }], ['update', 'users/' + id, { followersCount: INC(-1) }]]);
    st.following.delete(id); st.me.followingCount = Math.max(0, (st.me.followingCount || 1) - 1); }
  async function searchUsers(q) { q = (q || '').trim().toLowerCase().replace(/^@/, ''); if (!q) return [];
    const [a, b] = await Promise.all([D.query('users', { where: [['handle', '>=', q], ['handle', '<=', q + '']], limit: 15 }), D.query('users', { where: [['nameLower', '>=', q], ['nameLower', '<=', q + '']], limit: 15 })]);
    const m = new Map(); [...a, ...b].forEach(u => m.set(u.id, u)); return [...m.values()].filter(u => u.id !== uid()); }
  async function suggestions() { const r = await D.query('users', { order: ['createdAt', 'desc'], limit: 20 }); return r.filter(u => u.id !== uid() && !st.following.has(u.id)).slice(0, 10); }

  /* ---- notificações ---- */
  async function notify(to, n) { try { await D.add(`users/${to}/notifications`, { ...n, from: uid(), fromName: st.me.name, fromHandle: st.me.handle, fromAvatar: st.me.avatar || null, ts: Date.now(), read: false }); } catch (e) {} }

  async function markNotifsRead(list) { await Promise.all(list.filter(n => !n.read).map(n => D.update(`users/${uid()}/notifications/${n.id}`, { read: true }).catch(() => {}))); }

  const getChallenge = id => D.get('challenges/' + id);

    await D.set(`challenges/${c.id}/members/${uid()}`, { name: st.me.name, handle: st.me.handle, avatar: st.me.avatar || null, progress: prog, joinedAt: Date.now() }, false);
    await D.set(`users/${uid()}/joined/${c.id}`, { ts: Date.now() }, false); await D.update('challenges/' + c.id, { memberCount: INC(1) }).catch(() => {});

  async function leave(c) { await D.del(`challenges/${c.id}/members/${uid()}`); await D.del(`users/${uid()}/joined/${c.id}`); await D.update('challenges/' + c.id, { memberCount: INC(-1) }).catch(() => {}); st.joined = st.joined.filter(x => x !== c.id); }
  const members = id => D.query(`challenges/${id}/members`, { order: ['progress', 'desc'], limit: 100 });
  async function removeChallenge(c) { await D.del('challenges/' + c.id); await D.del(`users/${uid()}/joined/${c.id}`).catch(() => {}); st.joined = st.joined.filter(x => x !== c.id); }
  function progressFor(c) { return Stats.challengeProgress(st.acts, c); }
  async function syncChallenges(sport) { const list = await myChallenges(); await Promise.all(list.filter(c => !sport || c.sport === sport).map(c => D.set(`challenges/${c.id}/members/${uid()}`, { progress: progressFor(c), name: st.me.name, avatar: st.me.avatar || null }))); }

  /* ---- nutrição ---- */
  const day = d => D.get(`users/${uid()}/days/${d}`);
  const setDay = (d, patch) => D.set(`users/${uid()}/days/${d}`, patch);

  /* ---- LGPD ---- */
  async function exportData() { const days = await D.query(`users/${uid()}/days`, { limit: 400 }); const posts = await postsBy(uid());
    return { perfil: st.me, atividades: st.acts, fichas: st.workouts, seguindo: [...st.following], desafios: st.joined, nutricao: days, posts }; }
  async function deleteAccount() {
    const me = uid(); const posts = await D.query('posts', { where: [['authorId', '==', me]], limit: 500 });
    for (const p of posts) { await D.del('posts/' + p.id).catch(() => {}); if (p.imageId) await D.del('images/' + p.imageId).catch(() => {}); }
    for (const sub of ['activities', 'workouts', 'following', 'followers', 'joined', 'notifications', 'days']) { const rows = await D.query(`users/${me}/${sub}`, { limit: 1000 }).catch(() => []); for (const r of rows) await D.del(`users/${me}/${sub}/${r.id}`).catch(() => {}); }
    for (const cid of st.joined) await D.del(`challenges/${cid}/members/${me}`).catch(() => {});
    if (st.me.avatar) await D.del('images/' + st.me.avatar).catch(() => {});
    await D.del('handles/' + st.me.handle).catch(() => {}); await D.del('users/' + me);
    await AU.deleteUser();
  }

  return {
    init, get mode() { return mode; }, auth: { onChange: f => AU.onChange(f), signUp: (...a) => AU.signUp(...a), signIn: (...a) => AU.signIn(...a), google: () => AU.google(), reset: e => AU.reset(e), signOut: () => AU.signOut() },

    get me() { return st.me; }, get acts() { return st.acts; }, get workouts() { return st.workouts; }, get following() { return st.following; }, get joined() { return st.joined; }, isLiked: id => st.liked.has(id),
    addActivity, removeActivity, activitiesOf, saveWorkout, removeWorkout,
    createPost, feed, postsBy, setPostsVisibility, like, unlike, comments, comment, removePost,
    follow, unfollow, searchUsers, suggestions, followersOf: id => D.query(`users/${id}/followers`, { limit: 200 }), followingOf: id => D.query(`users/${id}/following`, { limit: 200 }),
    notifications, markNotifsRead, createChallenge, listChallenges, getChallenge, myChallenges, join, leave, members, removeChallenge, syncChallenges,
    day, setDay, exportData, deleteAccount, refreshActs: loadActs,
  };
})();

/* ---------------- Imagens: redimensiona e comprime no navegador ---------------- */
function fileToDataUrl(file, max = 1280, q = .74) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); let d = c.toDataURL('image/jpeg', q); if (d.length > 900000) d = c.toDataURL('image/jpeg', .55); res(d); };
    img.onerror = () => rej(new Error('Imagem inválida')); img.src = url;
  });
}
function chooseImage(max, q) { return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.onchange = async () => { const f = i.files && i.files[0]; if (!f) return res(null); try { res(await fileToDataUrl(f, max, q)); } catch (e) { toast('Não foi possível ler a imagem', 'x'); res(null); } }; i.click(); }); }

<script>

const emptyBox = (txt, btn = '') => `<div class="card" style="text-align:center;padding:26px 18px"><div class="muted small" style="line-height:1.55">${txt}</div>${btn ? `<div style="margin-top:14px">${btn}</div>` : ''}</div>`;

/* ---------------- Home ---------------- */
Screens.home = {

};

<script>

   ORA GYM — Treinar: fichas, musculação ao vivo, GPS (corrida/pedal),

let audioCtx = null;
function beep(f = 880, d = .15, n = 1) { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); for (let i = 0; i < n; i++) { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination); const t = audioCtx.currentTime + i * (d + .08); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.start(t); o.stop(t + d + .02); } } catch (e) {} }

/* Discreet one-shot confetti (canvas, ~1.8s, then stops) */
function confetti(cv, n = 60, main) {
  if (Motion.reduced || !cv) return; const r = cv.getBoundingClientRect(); const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = r.width * dpr; cv.height = r.height * dpr; const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);

  const ps = Array.from({ length: n }, () => ({ x: r.width / 2 + (Math.random() - .5) * 80, y: r.height * .36, vx: (Math.random() - .5) * 9, vy: -Math.random() * 11 - 4, s: 4 + Math.random() * 5, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  const f = now => { const t = (now - t0) / 1000; ctx.clearRect(0, 0, r.width, r.height);
    ps.forEach(p => { p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - t / 2.2); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t < 2.3) requestAnimationFrame(f); else ctx.clearRect(0, 0, r.width, r.height); };
  requestAnimationFrame(f);
}

        <div class="stack" style="gap:8px">${mem.length ? mem.map((m, i) => `<button class="list-item" style="text-align:left;${m.id === API.me.id ? 'border-color:color-mix(in oklab,var(--accent) 60%,transparent)' : ''}" data-profile-open="${m.id}"><span class="num" style="font-size:20px;width:26px;text-align:center;${i < 3 ? 'color:#E3192B' : 'color:var(--mute)'}">${i + 1}</span>${avatar(m)}<div style="flex:1;min-width:0"><div class="h3">${m.id === API.me.id ? 'Você' : esc(m.name)}</div><div class="muted small">${nv(m.progress || 0, 1)} ${esc(c.unit)}</div></div>${(m.progress || 0) >= c.target ? `<span style="color:#A3FF12">${icon('trophy', 20)}</span>` : ''}</button>`).join('') : emptyBox('Ninguém ainda.')}</div>
        <div class="wsec"><h2>Regras</h2></div><div class="card small muted" style="line-height:1.6">Vale toda atividade de ${sp.name.toLowerCase()} registrada no OraGym entre ${shortDate(c.start)} e ${shortDate(c.end)}. Ganha quem acumular mais ${esc(c.unit)}. Criado por ${esc(c.ownerName || '—')}.</div>
        <div class="row" style="gap:10px;margin-top:16px">${joined && !owner ? '<button class="btn btn-ghost" data-leave style="flex:1">Sair do desafio</button>' : ''}${owner ? '<button class="btn btn-ghost" data-delch style="flex:1;color:#FF6B76">Excluir desafio</button>' : ''}</div>
        <div style="height:60px"></div></div>`;
      hydrateImages(sc); Motion.fillBars(sc); Motion.fillRings(sc); wireUserRows(sc);
      bindScrollFx(el, { bar: $('.topbar', el), hero: $('.hero-stack', el), threshold: 260 });
      const reload = () => { el.innerHTML = Screens.challenge.render({ id }); Screens.challenge.mount(el, { id }); };
      const j = $('[data-join]', sc); if (j) j.onclick = async () => { j.disabled = true; try { await API.join(c); haptic([10, 30, 10]); toast('Você entrou no desafio'); reload(); } catch (x) { j.disabled = false; toast(errMsg(x), 'x'); } };
      const iv = $('[data-inv]', sc); if (iv) iv.onclick = () => inviteSheet(c);
      const lv = $('[data-leave]', sc); if (lv) lv.onclick = async () => { if (await confirmDialog('Sair do desafio?', 'Seu nome sai do ranking.', 'Sair')) { await API.leave(c); toast('Você saiu do desafio'); reload(); } };
      const dl = $('[data-delch]', sc); if (dl) dl.onclick = async () => { if (await confirmDialog('Excluir desafio?', 'O desafio some para todos os participantes.', 'Excluir', true)) { await API.removeChallenge(c); toast('Desafio excluído', 'trash'); Nav.back(); } };
      if (joined && mine >= c.target && !sessionStorage.getItem('won-' + id)) { sessionStorage.setItem('won-' + id, 1); celebrate({ title: 'Desafio concluído', sub: c.name, big: `${nv(c.target, 1)} ${c.unit}`, points: 0, color: '#A3FF12', icon: 'trophy', share: false }); }
    } catch (x) { sc.innerHTML = `<div class="pad" style="padding-top:120px">${emptyBox(errMsg(x))}</div>`; }
  },
};

</script>
<script>
/* ============================================================
   ORA GYM — Perfil, configurações (privacidade/LGPD/conta),
   loja, música e alimentação — tudo ligado à conta
   ============================================================ */
const LEVELS = ['Iniciante', 'Intermediário', 'Avançado'];

Screens.profile = {
  render() {
    const me = API.me; const main = mySports()[0]; const ach = Stats.achievements(API.acts, me); const got = ach.filter(a => a[2]).length;
    const streak = Stats.streak(API.acts);
    return `<div class="scroll"><div class="pf-hero" style="position:relative;height:500px">
      <div class="hero-stack" style="position:absolute;inset:0" data-e="0" data-ek="zoom">${scene('profile', main, { pos: 'center 15%' })}</div>
      <div class="between" style="position:absolute;left:20px;right:20px;top:calc(var(--safe-top) + 4px)"><div class="m-only" data-e="1" data-ek="fade">${brandLockup(22)}</div><span class="d-only"></span>
        <button class="icon-btn glass" aria-label="Configurações" data-push="settings" data-e="1" data-ek="fade">${icon('settings', 20)}</button></div>
      <div class="page" style="position:absolute;left:0;right:0;bottom:22px;padding:0 20px">
        <div class="row" style="gap:14px;margin-bottom:14px" data-e="2">${meAv('lg')}<div><div class="row" style="gap:6px"><span class="tag">${me.private ? icon('lock', 12, 2) + 'Privado' : 'Público'}</span><span class="tag neon">${esc(me.level || 'Intermediário')}</span></div><div class="muted small" style="margin-top:8px">@${esc(me.handle)}</div></div></div>
        <h1 class="display pf-name" style="font-size:clamp(30px,10.5vw,43px);margin:0 0 18px">${esc(me.name)}</h1>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);max-width:560px" data-e="4">${[[API.acts.length, 'Atividades'], [streak, 'Dias seguidos'], [got, 'Conquistas'], [mySports().length, 'Esportes']].map(x => `<div><div class="num" style="font-size:32px;line-height:1"><span data-count="${x[0]}">0</span></div><div class="muted" style="font-size:11px;margin-top:6px">${x[1]}</div></div>`).join('')}</div></div></div>
      <div class="pad page">
        ${me.bio ? `<p style="margin:4px 0 14px;line-height:1.55;color:#D3DCE8">${esc(me.bio)}</p>` : ''}
        <div class="row" style="gap:10px;margin-top:6px;max-width:560px" data-e="5"><button class="btn btn-white" style="flex:1" id="pf-edit">Editar perfil</button><button class="icon-btn" style="width:56px;height:56px;background:rgba(255,255,255,.06);border:1px solid var(--stroke)" aria-label="Compartilhar perfil" id="pf-share">${icon('share', 20)}</button></div>
        <div class="row" style="gap:18px;margin-top:18px;justify-content:space-around;max-width:560px" data-e="6">${[[me.postsCount || 0, 'Publicações', ''], [me.followersCount || 0, 'Seguidores', 'followers'], [me.followingCount || 0, 'Seguindo', 'following']].map(x => `<button style="text-align:center" ${x[2] ? `data-flist="${x[2]}"` : ''}><div class="h2">${fmt(x[0])}</div><div class="muted small">${x[1]}</div></button>`).join('')}</div>
        <div class="wsec" data-e="7"><h2>Modalidades</h2><button class="link" id="pf-sports">Editar</button></div>
        <div class="hscroll" data-e="8">${mySports().map(id => { const x = SPORTS[id]; const S = SS(id); return `<button class="card press" style="width:160px;flex:none;text-align:left;--accent:${x.c}" data-push="world" data-params='{"id":"${id}"}'><span style="color:${x.c}">${icon(x.icon, 24)}</span><div class="h3" style="margin-top:14px">${x.name}</div><div class="num" style="font-size:22px;margin-top:4px">${S.count}</div><div class="muted" style="font-size:11px">${S.count === 1 ? 'atividade' : 'atividades'}</div></button>`; }).join('')}</div>
        <div class="wsec" data-e="9"><h2>Conquistas</h2><span class="muted small">${got}/${ach.length}</span></div>
        <div class="grid3 pf-ach" data-e="10">${ach.map((b, i) => `<button class="card press" style="padding:16px 8px;text-align:center;${b[2] ? '' : 'opacity:.5'}" data-badge="${i}" aria-label="${b[0]}${b[2] ? '' : ' (bloqueada)'}">
          <span style="display:grid;place-items:center;width:54px;height:54px;margin:0 auto;border-radius:50%;${b[2] ? 'background:radial-gradient(circle at 35% 30%,#5c0a10,#1a0507);color:#FF4A57;box-shadow:0 0 0 1px rgba(227,25,43,.45),0 0 24px -6px #E3192B' : 'background:rgba(255,255,255,.05);color:var(--mute)'}">${icon(b[2] ? b[1] : 'lock', 24)}</span><span class="small" style="display:block;margin-top:10px">${b[0]}</span></button>`).join('')}</div>
        <div class="wsec" data-e="11"><h2>Recordes pessoais</h2></div>
        <div data-e="12">${(() => { const R = mySports().flatMap(id => SS(id).records.slice(0, 2).map(r => [id, r])); return R.length ? `<div class="stack pf-rec">${R.map(([id, r]) => `<div class="list-item" style="--accent:${SPORTS[id].c}"><span class="ico" style="color:${SPORTS[id].c}">${icon(SPORTS[id].icon, 20)}</span><div style="flex:1;min-width:0"><div class="h3">${esc(r.k)}</div><div class="muted small">${SPORTS[id].name} · ${esc(r.d)}</div></div><span class="num" style="font-size:18px">${esc(r.v)}</span></div>`).join('')}</div>` : emptyBox('Seus recordes aparecem aqui conforme você registra atividades.'); })()}</div>
        <div class="wsec" data-e="13"><h2>Publicações</h2><button class="link" data-compose-me>+ Publicar</button></div>
        <div data-async="pf-posts" data-e="14"><div class="card skeleton" style="height:120px"></div></div>
        <div class="wsec"><h2>Atalhos</h2></div>
        <div class="grid2 pf-short">${[['shop', 'bag', 'Loja esportiva'], ['music', 'music', 'Música'], ['nutrition', 'leaf', 'Alimentação'], ['settings', 'shield', 'Privacidade e conta']].map(([sc, ic, l]) => `<button class="list-item press" style="text-align:left" data-push="${sc}" data-params='{"id":"${main}"}'><span class="ico">${icon(ic, 20)}</span><span class="h3">${l}</span></button>`).join('')}</div>
        <div class="bottom-space"></div></div></div>`;
  },
  mount(el) {
    Motion.kinetic($('.pf-name', el), 300); bindScrollFx(el, { hero: $('.hero-stack', el) }); hydrateImages(el);
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-badge]'); if (b) { const x = Stats.achievements(API.acts, API.me)[+b.dataset.badge];
        Sheet.open(`<div style="text-align:center;padding:10px 0"><span style="display:grid;place-items:center;width:70px;height:70px;margin:0 auto;border-radius:50%;background:${x[2] ? 'rgba(227,25,43,.16);color:#FF4A57' : 'rgba(255,255,255,.06)'}" data-e="0">${icon(x[2] ? x[1] : 'lock', 28)}</span><h3 class="h2" style="margin-top:16px" data-e="1">${x[0]}</h3><p class="muted small" data-e="2">${x[2] ? 'Conquista desbloqueada.' : `Progresso: ${Math.round(x[3] * 100)}%`}</p><div class="bar" style="margin:16px 30px 0" data-e="3"><i data-bar="${x[3]}" style="transform:scaleX(0)"></i></div></div>`, w => Motion.fillBars(w), { label: x[0] }); }
      if (e.target.closest('#pf-edit')) editProfileSheet();
      if (e.target.closest('#pf-share')) shareSheet(`${API.me.name} no OraGym`, `@${API.me.handle} · ${mySports().map(i => SPORTS[i].name).join(', ')}`, location.origin + location.pathname);
      if (e.target.closest('#pf-sports')) editSportsSheet();
      if (e.target.closest('[data-compose-me]')) composePost({});
      const fl = e.target.closest('[data-flist]'); if (fl) followListSheet(API.me.id, fl.dataset.flist);
    });
    (async () => { const box = $('[data-async="pf-posts"]', el); try { const L = await API.postsBy(API.me.id);
      box.innerHTML = L.length ? `<div class="pf-posts">${L.map(p => postCard(p, true)).join('')}</div>` : emptyBox('Sem publicações ainda. Conclua uma atividade e publique o resultado.'); hydrateImages(box); wirePosts(box); } catch (x) { box.innerHTML = emptyBox(errMsg(x)); } })();
  },
  onReturn() { Nav.refresh(); },
};
async function followListSheet(id, kind) {
  Sheet.open(`<h3 class="h2">${kind === 'followers' ? 'Seguidores' : 'Seguindo'}</h3><div class="stack fl-list" style="gap:8px;margin-top:14px"><div class="skeleton" style="height:56px;border-radius:16px"></div></div>`,
    async (w, close) => { const box = $('.fl-list', w); wireUserRows(box, close);
      try { const rows = kind === 'followers' ? await API.followersOf(id) : await API.followingOf(id); const users = (await Promise.all(rows.map(r => API.getUser(r.id).catch(() => null)))).filter(Boolean);
        box.innerHTML = users.length ? users.map(userRow).join('') : '<p class="muted small">Ninguém por aqui ainda.</p>'; hydrateImages(box); } catch (x) { box.innerHTML = `<p class="muted small">${errMsg(x)}</p>`; } }, { label: 'Pessoas' });
}
function editProfileSheet() {
  const me = API.me; let avatarData = null; let lvl = me.level || 'Intermediário';
  Sheet.open(`<h3 class="h2" data-e="0">Editar perfil</h3><div style="margin-top:16px" data-e="1"><div class="row ep-av" style="margin-bottom:16px;gap:14px">${meAv('lg')}<button class="btn btn-ghost btn-sm" data-av>${icon('camera', 16)}Trocar foto</button></div>
    <div class="field"><label for="ep-n">Nome</label><input class="input" id="ep-n" value="${esc(me.name)}" maxlength="50" autocomplete="name"></div>
    <div class="field"><label for="ep-h">Usuário</label><input class="input" id="ep-h" value="@${esc(me.handle)}" maxlength="25" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label for="ep-b">Bio</label><textarea class="input" id="ep-b" rows="3" maxlength="160" placeholder="Conte um pouco sobre seus treinos">${esc(me.bio || '')}</textarea></div>
    <div class="field"><label>Nível</label>${seg(LEVELS.map(l => [l, l]), lvl, 'eplvl')}</div>
    <button class="btn btn-white btn-block" data-ep>Salvar</button></div>`,
    (w, close) => { mountSeg($('.seg', w), b => lvl = b.dataset.eplvl); hydrateImages(w);
      w.addEventListener('click', async e => {
        if (e.target.closest('[data-av]')) { const d = await chooseImage(480, .82); if (d) { avatarData = d; const av = $('.ep-av .av', w); av.style.backgroundImage = `url("${d}")`; av.style.backgroundSize = 'cover'; av.textContent = ''; } }
        const s = e.target.closest('[data-ep]'); if (s) { const name = $('#ep-n', w).value.trim(); if (name.length < 2) return toast('Informe seu nome', 'x'); s.disabled = true; s.textContent = 'Salvando…';
          try { const patch = { name, handle: $('#ep-h', w).value.replace(/^@/, '').trim(), bio: $('#ep-b', w).value.trim(), level: lvl };
            if (avatarData) { const old = API.me.avatar; patch.avatar = await API.putImage(avatarData); if (old) API.removeImage && API.removeImage(old).catch(() => {}); }
            await API.updateProfile(patch); close(); Nav.refresh(); toast('Perfil atualizado'); } catch (x) { s.disabled = false; s.textContent = 'Salvar'; toast(errMsg(x), 'x'); } } }); }, { label: 'Editar perfil' });
}
function editSportsSheet() {
  const sel = [...mySports()];
  Sheet.open(`<h3 class="h2" data-e="0">Seus esportes</h3><p class="muted small" style="margin:6px 0 0">O primeiro da lista é o seu principal.</p><div class="grid2" style="margin-top:16px" data-e="1">${SPORT_IDS.map(id => `<button class="opt ${sel.includes(id) ? 'on' : ''}" style="--accent:${SPORTS[id].c};padding:14px" data-es="${id}" aria-pressed="${sel.includes(id)}"><span style="color:${SPORTS[id].c}">${icon(SPORTS[id].icon, 20)}</span><span class="h3" style="font-size:14px">${SPORTS[id].name}</span><span class="check">${icon('check', 15, 2.6)}</span></button>`).join('')}</div>
    <button class="btn btn-white btn-block" style="margin-top:16px" data-es-ok>Salvar</button>`,
    (w, close) => w.addEventListener('click', async e => { const b = e.target.closest('[data-es]'); if (b) { const i = sel.indexOf(b.dataset.es); i >= 0 ? sel.splice(i, 1) : sel.push(b.dataset.es); b.classList.toggle('on'); b.setAttribute('aria-pressed', i < 0); haptic(5); }
      if (e.target.closest('[data-es-ok]')) { if (!sel.length) return toast('Escolha ao menos um esporte', 'x'); try { await API.updateProfile({ sports: sel }); close(); trainSport = null; Nav.refresh(); toast('Esportes atualizados'); } catch (x) { toast(errMsg(x), 'x'); } } }), { label: 'Esportes' });
}

/* ---------------- Configurações: privacidade, conta, LGPD ---------------- */
Screens.settings = {
  render() {
    const me = API.me; const pv = me.privacy || {};
    const sw = (k, on, t, d) => `<div class="toggle-row"><span><span class="h3" style="display:block">${t}</span><span class="muted small">${d}</span></span><button class="switch" role="switch" aria-checked="${!!on}" data-pv="${k}" aria-label="${t}"></button></div>`;
    return `<div class="topbar solid"><button class="icon-btn glass" data-back aria-label="Voltar">${icon('back', 20, 2)}</button><div class="title">Configurações</div><span style="width:46px"></span></div>
    <div class="scroll"><div class="pad page" style="padding-top:calc(var(--safe-top) + 70px);max-width:680px">
      <div class="kicker" data-e="0">Conta</div><div class="stack" style="gap:8px;margin-top:12px" data-e="1">
        <div class="list-item"><span class="ico">${icon('mail', 20)}</span><div style="flex:1;min-width:0"><div class="h3">E-mail</div><div class="muted small" style="overflow:hidden;text-overflow:ellipsis">${esc(me.email || '—')}</div></div></div>
        <button class="list-item press" style="text-align:left" id="st-pass"><span class="ico">${icon('lock', 20)}</span><div style="flex:1"><div class="h3">Redefinir senha</div><div class="muted small">Enviamos um link para o seu e-mail</div></div>${icon('next', 18)}</button>
        <button class="list-item press" style="text-align:left" id="st-out"><span class="ico">${icon('back', 20)}</span><div style="flex:1"><div class="h3">Sair da conta</div></div></button></div>
      <div class="kicker" style="margin-top:28px" data-e="2">Privacidade</div><div class="stack" style="gap:8px;margin-top:12px" data-e="3">
        ${sw('private', me.private, 'Perfil privado', 'Suas atividades e publicações ficam visíveis só para você')}
        ${sw('hideRouteEnds', pv.hideRouteEnds, 'Zona de privacidade', 'Oculta os primeiros e últimos 200 m dos trajetos publicados')}
        ${sw('showWeight', pv.showWeight, 'Mostrar cargas nas publicações', 'Exibe o volume levantado nos posts de musculação')}</div>
      <div class="card row" style="margin-top:10px;gap:12px"><span style="color:#A3FF12">${icon('pin', 20)}</span><div class="small muted" style="line-height:1.5">A localização é usada somente enquanto você grava uma corrida ou pedal, e nunca em segundo plano.</div></div>
      <div class="kicker" style="margin-top:28px" data-e="4">Seus dados (LGPD)</div><div class="stack" style="gap:8px;margin-top:12px" data-e="5">
        <button class="list-item press" style="text-align:left" id="st-export"><span class="ico">${icon('copy', 20)}</span><div style="flex:1"><div class="h3">Baixar meus dados</div><div class="muted small">Arquivo JSON com perfil, atividades, fichas, posts e alimentação</div></div></button>
        <button class="list-item press" style="text-align:left" id="st-delete"><span class="ico" style="color:#FF4D5E;background:rgba(255,77,94,.12)">${icon('trash', 20)}</span><div style="flex:1"><div class="h3">Excluir minha conta</div><div class="muted small">Apaga a conta e todos os seus dados de forma permanente</div></div></button></div>
      <div class="kicker" style="margin-top:28px" data-e="6">Acessibilidade</div><div class="stack" style="gap:8px;margin-top:12px" data-e="7">
        <div class="toggle-row"><span><span class="h3" style="display:block">Reduzir movimento</span><span class="muted small">Troca animações por transições simples</span></span><button class="switch" role="switch" aria-checked="${Motion.reduced}" id="st-rm" aria-label="Reduzir movimento"></button></div></div>
      <div class="kicker" style="margin-top:28px">Sobre</div><div class="stack" style="gap:8px;margin-top:12px"><button class="list-item press" style="text-align:left" id="st-terms"><span class="ico">${icon('shield', 20)}</span><div style="flex:1"><div class="h3">Termos e privacidade</div></div>${icon('next', 18)}</button></div>
      <p class="muted" style="font-size:11px;text-align:center;margin-top:24px">OraGym · versão 1.0</p>
      <div style="height:40px"></div></div></div>`;
  },
  mount(el) {
    el.addEventListener('click', async e => {
      const s = e.target.closest('[data-pv]'); if (s) { const k = s.dataset.pv; const v = s.getAttribute('aria-checked') !== 'true'; s.setAttribute('aria-checked', v); haptic(6);
        try { if (k === 'private') { await API.updateProfile({ private: v }); await API.setPostsVisibility(v ? 'followers' : 'public'); } else await API.updateProfile({ privacy: { ...(API.me.privacy || {}), [k]: v } }); toast('Preferência salva'); } catch (x) { s.setAttribute('aria-checked', !v); toast(errMsg(x), 'x'); } }
      if (e.target.closest('#st-pass')) { try { await API.auth.reset(API.me.email); toast('Link enviado para ' + API.me.email, 'mail'); } catch (x) { toast(errMsg(x), 'x'); } }
      if (e.target.closest('#st-out')) { if (await confirmDialog('Sair da conta?', 'Você pode entrar de novo quando quiser.', 'Sair')) await API.auth.signOut(); }
      if (e.target.closest('#st-export')) { try { const d = await API.exportData(); const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `oragym-${API.me.handle}-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Arquivo gerado'); } catch (x) { toast(errMsg(x), 'x'); } }
      if (e.target.closest('#st-delete')) { if (!(await confirmDialog('Excluir sua conta?', 'Perfil, atividades, fichas, publicações, comentários e fotos serão apagados para sempre. Isso não pode ser desfeito.', 'Excluir tudo', true))) return;
        const t = document.createElement('div'); t.className = 'busy-veil'; t.innerHTML = '<div class="spinner"></div><div class="muted small" style="margin-top:14px">Excluindo seus dados…</div>'; document.body.appendChild(t);
        try { await API.deleteAccount(); toast('Conta excluída', 'trash'); } catch (x) { toast(x && x.code === 'auth/requires-recent-login' ? 'Por segurança, saia e entre de novo antes de excluir a conta.' : errMsg(x), 'x'); } t.remove(); }
      const rm = e.target.closest('#st-rm'); if (rm) { const v = rm.getAttribute('aria-checked') !== 'true'; rm.setAttribute('aria-checked', v); Motion.setReduced(v); Store.set({ reduced: v }); }
      if (e.target.closest('#st-terms')) termsSheet();
    });
  },
};

/* ---------------- Loja: curadoria com busca real em lojas ---------------- */
const favs = () => Store.get().favs || {};
function productCard(p, sid, i, auto) {
  const k = sid + i; const fav = !!favs()[k];

let nuDate = null;

        <div class="wsec" data-e="3"><h2>Hidratação</h2><span class="muted small" id="nu-w">${water} de 10 copos (250 ml)</span></div>
        <div class="row" style="gap:6px" data-e="4">${Array.from({ length: 10 }, (_, i) => `<button class="press" style="flex:1;height:52px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--stroke);${i < water ? 'background:rgba(56,189,248,.22);color:#38BDF8' : 'color:var(--mute2)'}" data-cup="${i}" aria-label="${i + 1} copos">${icon('drop', 18)}</button>`).join('')}</div>
        <div class="wsec" data-e="5"><h2>Refeições</h2><span class="muted small">${meals.length}</span></div>
        <div data-e="6">${meals.length ? `<div class="stack">${meals.map((m, i) => `<div class="list-item"><span class="ico" style="color:#A3FF12;background:rgba(163,255,18,.1)">${icon('leaf', 20)}</span><div style="flex:1;min-width:0"><div class="between"><span class="h3">${esc(m.n)}</span><span class="num" style="font-size:16px">${fmt(m.kcal || 0)} kcal</span></div><div class="muted small" style="margin-top:3px">${esc(m.t || '')}${m.items ? ' · ' + esc(m.items) : ''}${m.p || m.c || m.f ? ` · P${m.p || 0} C${m.c || 0} G${m.f || 0}` : ''}</div></div><button class="icon-btn" style="width:34px;height:34px;background:rgba(255,255,255,.06)" data-mdel="${i}" aria-label="Remover ${esc(m.n)}">${icon('x', 14)}</button></div>`).join('')}</div>` : emptyBox('Nenhuma refeição registrada neste dia.', `<button class="btn btn-white btn-sm" id="nu-add2">${icon('plus', 16)}Adicionar refeição</button>`)}</div>

          (w, close) => $('[data-gk]', w).onclick = async () => { const v = +$('#gk', w).value; if (!(v >= 800)) return toast('Informe um valor válido', 'x'); try { await API.updateProfile({ kcalGoal: v }); close(); draw(); } catch (x) { toast(errMsg(x), 'x'); } }, { label: 'Meta' });

          const m = { n, items: $('#ml-i', w).value.trim(), kcal: Math.round(k || 0), t: $('#ml-t', w).value, p: +$('#ml-p', w).value || 0, c: +$('#ml-c', w).value || 0, f: +$('#ml-f', w).value || 0 };
          try { const cur = (await API.day(nuDate)) || {}; await API.setDay(nuDate, { meals: [...(cur.meals || []), m].sort((a, b) => (a.t || '').localeCompare(b.t || '')) }); close(); draw(); toast('Refeição adicionada'); } catch (x) { toast(errMsg(x), 'x'); } }, { label: 'Adicionar refeição' });

<script>
/* ============================================================
   ORA GYM — Academia (musculação): check-in e sequência, agenda
   semanal de fichas, modo treino com séries/descanso/cronômetro,
   cardio opcional, avaliação do treino e resumo comparativo.
   ============================================================ */
const WD = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const WD3 = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const WD1 = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
const CARDIOS = ['Esteira', 'Bicicleta', 'Elíptico', 'Escada', 'Remo', 'Corda'];
const isLift = a => a && a.sport === 'musculacao';
const ddmm = t => new Date(t).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const kgs = v => fmt(v || 0, (v || 0) % 1 ? 1 : 0);
const secStr = s => s >= 60 ? (s % 60 ? `${Math.floor(s / 60)} min ${s % 60} s` : `${s / 60} min`) : `${s} s`;
const noon = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); return x; };

/* ---------- histórico por exercício ---------- */
function lastFor(exn, beforeTs = Infinity) {
  for (const a of API.acts) { if (!isLift(a) || a.startedAt >= beforeTs) continue; const s = (a.sets || []).filter(x => x.ex === exn); if (s.length) return { at: a.startedAt, sets: s }; }
  return null;
}
function lastSetsFor(exn) { const l = lastFor(exn); return l ? l.sets : null; }
const setTxt = s => s.sec != null && s.reps == null ? secStr(s.sec) : `${s.kg ? kgs(s.kg) + ' kg × ' : ''}${s.reps}`;

/* ---------- presença, check-in e sequência ---------- */
function presence() { const s = new Set((API.me && API.me.checkins) || []); API.acts.forEach(a => { if (isLift(a)) s.add(dayKey(new Date(a.startedAt))); }); return s; }
function schedule() { const s = new Set(); API.workouts.forEach(w => (w.days || []).forEach(d => s.add(d))); return s; }
function streakInfo() {
  const P = presence(), sched = schedule(); const today = noon(new Date());
  const breaks = (d, gap) => sched.size ? sched.has(d.getDay()) : gap > 1;
  let cur = 0, gap = 0; const d = new Date(today); if (!P.has(dayKey(d))) d.setDate(d.getDate() - 1);
  for (let i = 0; i < 800; i++) { if (P.has(dayKey(d))) { cur++; gap = 0; } else if (breaks(d, ++gap)) break; d.setDate(d.getDate() - 1); }
  let best = cur; const keys = [...P].sort(); if (keys.length) { const s = noon(new Date(keys[0] + 'T12:00')); let run = 0; gap = 0;
    for (const x = new Date(s); x <= today; x.setDate(x.getDate() + 1)) { if (P.has(dayKey(x))) { run++; gap = 0; if (run > best) best = run; } else if (breaks(x, ++gap)) run = 0; } }
  return { cur, best, today: P.has(dayKey(today)), P, sched };
}
function streakLine(si) {
  if (!si.best) return 'Segure o botão quando chegar na academia para começar sua sequência.';
  if (si.cur >= si.best) return si.cur === 1 ? 'Dia 1 da sequência. Amanhã tem mais.' : `${si.cur} dias seguidos — é o seu recorde.`;
  const f = si.best - si.cur + 1; return `${si.cur ? si.cur + ' dias seguidos. ' : ''}Mais ${f} ${f === 1 ? 'dia' : 'dias'} e você passa o recorde de ${si.best}.`;
}
async function checkIn(silent) {
  const k = dayKey(); const L = new Set((API.me.checkins) || []); if (L.has(k)) return false; L.add(k);
  await API.updateProfile({ checkins: [...L].sort().slice(-500) }); if (!silent) { haptic([10, 40, 14]); toast('Check-in de hoje feito'); } return true;
}
function monthInfo(si) {
  const n = new Date(); const pre = dayKey(n).slice(0, 7); const cnt = [...si.P].filter(k => k.startsWith(pre)).length;
  const dim = new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate(); const wk = si.sched.size || Stats.sport(API.acts, 'musculacao', API.me).goal.target || 4;
  return { cnt, goal: API.me.liftMonthGoal || Math.round(wk * dim / 7) };
}

/* ---------- agenda: treino de hoje ---------- */
function todayWorkout() {
  const wd = new Date().getDay(); const t = API.workouts.find(w => (w.days || []).includes(wd)); if (t) return { w: t, today: true };
  const n = nextWorkout(); return n ? { w: n, today: false } : null;
}
function dayLabel(w) {
  const d = w.days || []; if (!d.length) return ''; const wd = new Date().getDay(); if (d.includes(wd)) return 'Hoje';
  return d.slice().sort((a, b) => ((a - wd + 7) % 7) - ((b - wd + 7) % 7)).map(x => WD[x]).join(', ');
}

/* ---------- sessão em andamento (sobrevive a fechar o app) ---------- */
const Sess = {
  key: () => 'lift.' + (API.me ? API.me.id : 'anon'),
  get() { return Store.get()[this.key()] || null; },
  set(s) { Store.set({ [this.key()]: s }); },
  clear() { Store.set({ [this.key()]: null }); },
};
function mkEx(x) {
  const type = x.type || 'reps'; const last = lastFor(x.n); const n = Math.max(1, x.sets || 3);
  const sets = Array.from({ length: n }, (_, i) => { const p = last && (last.sets[i] || last.sets[last.sets.length - 1]);
    if (type === 'time') return { sec: (p && p.sec) || x.sec || 60, t: 0, done: false };
    return { kg: p ? (p.kg || 0) : (x.kg || 0), reps: p ? (p.reps || x.reps || 10) : (x.reps || 10), done: false }; });
  return { n: x.n, type, group: EX_GROUP[x.n] || x.group || '', rest: x.rest == null ? 60 : x.rest, sets };
}
function newSession(w) {
  return { wid: w ? w.id : null, name: w ? w.name : 'Treino livre', focus: w ? (w.focus || '') : '', startedAt: Date.now(), pausedTotal: 0, pausedAt: null, cur: 0,
    ex: (w ? w.exercises : []).map(mkEx), cardio: w && w.cardio && w.cardio.name ? { name: w.cardio.name, min: w.cardio.min || 20, mode: null, doneMin: 0 } : null, restEnd: 0, restTotal: 0, cron: null };
}
const sElapsed = s => Math.max(0, ((s.pausedAt || Date.now()) - s.startedAt - (s.pausedTotal || 0)) / 1000);
const exDone = e => e.sets.every(x => x.done);
const doneCount = s => s.ex.filter(exDone).length;
const estMin = (s, all) => Math.round(s.ex.reduce((m, e) => m + e.sets.filter(x => all || !x.done).reduce((a, x) => a + (e.type === 'reps' ? (x.reps || 10) * 4 : (x.sec || 60)) + (e.rest || 0), 0), 0) / 60 + (s.cardio && s.cardio.mode === 'with' && !s.cardio.doneMin ? s.cardio.min : 0));
const planMin = w => estMin({ ex: w.exercises.map(x => ({ type: x.type || 'reps', rest: x.rest == null ? 60 : x.rest, sets: Array.from({ length: x.sets || 3 }, () => ({ reps: x.reps, sec: x.sec, done: false })) })), cardio: null }, true);
const firstPending = s => { const i = s.ex.findIndex((e, k) => k >= s.cur && !exDone(e)); return i >= 0 ? i : s.ex.findIndex(e => !exDone(e)); };
const exLine = x => x.type === 'time' ? `${x.sets} × ${secStr(x.sec || 60)}${x.rest ? ' · ' + x.rest + 's' : ''}` : x.type === 'cardio' ? `${x.sets[0] ? secStr(x.sets[0].sec) : ''}` : `${x.sets} × ${x.reps}${x.kg ? ' · ' + kgs(x.kg) + ' kg' : ''} · ${x.rest == null ? 60 : x.rest}s`;
const sExLine = e => e.type === 'time' ? `${e.sets.length} × ${secStr(e.sets[0].sec)} · ${e.rest}s` : e.type === 'cardio' ? `Meta ${secStr(e.sets[0].sec)}` : `${e.sets.length} × ${e.sets[0].reps}${e.sets[0].kg ? ' · ' + kgs(e.sets[0].kg) + ' kg' : ''} · ${e.rest}s`;

async function startSession(w) {
  const cur = Sess.get();
  if (cur && cur.wid !== (w ? w.id : null)) { if (!(await confirmDialog('Trocar de treino?', `Você tem “${cur.name}” em andamento. Ele será descartado.`, 'Descartar e começar', true))) return null; }
  if (cur && cur.wid === (w ? w.id : null)) return cur;
  const s = newSession(w); Sess.set(s);
  let ck = false; try { ck = await checkIn(true); } catch (e) {}
  toast(ck ? 'Treino iniciado. Check-in de hoje feito.' : 'Treino iniciado', 'bolt'); haptic([10, 40, 10]); return s;
}

function rhythm(si) {
  const t = noon(new Date()); const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  const done = days.filter(d => si.P.has(dayKey(d))).length; const goal = si.sched.size || (Stats.sport(API.acts, 'musculacao', API.me).goal.target) || 4;
  const caps = days.map(d => { const k = dayKey(d); const on = si.P.has(k), isT = k === dayKey(t), fut = d > t, pl = si.sched.has(d.getDay());
    return `<div class="fx-cap ${on ? 'on' : ''} ${isT ? 'today' : ''} ${fut ? 'fut' : ''} ${pl && !on ? 'plan' : ''}" title="${WD[d.getDay()]} ${d.getDate()}"><i></i><span>${WD3[d.getDay()]}</span><b>${d.getDate()}</b></div>`; }).join('');
  const start = new Date(mon); start.setDate(mon.getDate() - 7 * 11);
  const heat = Array.from({ length: 12 }, (_, w) => `<div class="fx-hcol">${Array.from({ length: 7 }, (_, d) => { const x = new Date(start); x.setDate(start.getDate() + w * 7 + d); const k = dayKey(x); return `<i class="${si.P.has(k) ? 'on' : ''} ${x > t ? 'fut' : ''}"></i>`; }).join('')}</div>`).join('');
  const weeks = Array.from({ length: 12 }, (_, w) => { let n = 0; for (let d = 0; d < 7; d++) { const x = new Date(start); x.setDate(start.getDate() + w * 7 + d); if (si.P.has(dayKey(x))) n++; } return n; });
  const avg = weeks.slice(0, 11).reduce((a, b) => a + b, 0) / 11;
  return { done, goal, html: `<div class="fx-caps">${caps}</div><div class="fx-heatwrap"><div class="fx-heat">${heat}</div><div class="fx-heatlbl"><b>${fmt(avg, 1)}</b><span>dias/semana<br>nas últimas 11</span></div></div>` };
}

document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-hold-checkin]'); if (!b || b.classList.contains('done')) return; const f = $('.f', b); if (!f) return;
  b.classList.add('holding'); haptic(6); const an = A(f, [{ strokeDashoffset: 289 }, { strokeDashoffset: 0 }], { duration: Motion.reduced ? 1 : 750, easing: 'linear', fill: 'forwards' });

    <div class="scroll fx-scope"><canvas id="ls-conf" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5"></canvas>

        <div class="pad page fx-whero-in" style="max-width:760px"><div class="fx-k" data-e="0">${icon('check', 13, 3)} Treino concluído · ${new Date(a.startedAt).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' })}</div><h1 class="display fx-wt" style="font-size:34px" data-e="1">${esc(a.title)}</h1>
          <div class="fx-m" data-e="1">${prev ? `Comparado com ${new Date(prev.startedAt).toLocaleDateString('pt-BR')}` : 'Primeiro registro desta ficha — o próximo já terá comparação'}</div></div></div>

        ${a.prCount ? `<div class="fx-prbanner" data-e="2">${icon('medal', 20, 2)}<div><b>${a.prCount === 1 ? 'Novo recorde de carga' : a.prCount + ' recordes de carga'}</b><div class="fx-m">${(a.prs || []).map(esc).join(', ')}</div></div></div>` : ''}
        <div class="fx-bigs" data-e="3">${big('Duração', hms(a.duration), prev ? `<span class="fx-m">antes ${hms(prev.duration)}</span>` : '')}${big('Volume', volStr(a.volume), prev ? pctBadge(a.volume || 0, prev.volume || 0) : '')}${big('Séries', `${doneN}<small>/${a.plannedSets || doneN}</small>`, prev ? `<span class="fx-m">antes ${(prev.sets || []).length}</span>` : '')}${big('Intensidade', a.difficulty == null ? '—' : `${a.difficulty}<small>/10</small>`, prev && prev.difficulty != null ? `<span class="fx-m">antes ${prev.difficulty}/10</span>` : '')}</div>
        ${a.cardio ? `<div class="fx-glass fx-cardio" style="margin-top:12px"><span class="fx-ic">${icon('heart', 19, 2)}</span><div class="h3" style="flex:1">${esc(a.cardio.name)}</div><b class="num">${a.cardio.min} min</b></div>` : ''}
        ${a.notes ? `<div class="fx-quote">“${esc(a.notes)}”</div>` : ''}
        <div class="wsec" data-e="4"><h2>Série a série</h2>${prev ? '<span class="fx-legend"><i class="prev"></i>antes <i class="now"></i>hoje</span>' : ''}</div>

  },
  mount(el, { id, fresh }) {
    const a = API.acts.find(x => x.id === id); if (!a) return; bindScrollFx(el, { bar: $('.topbar', el), hero: $('.fx-whero .hero-stack', el), threshold: 200 });
    $$('.fx-bpair i', el).forEach((b, k) => A(b, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { spring: [160, 18], delay: 300 + k * 25 }));
    if (fresh) { setTimeout(() => confetti($('#ls-conf', el), a.prCount ? 90 : 40), 250); if (a.prCount) setTimeout(() => celebrate({ title: 'Novo recorde pessoal', sub: (a.prs || []).join(', '), big: `${a.prCount} ${a.prCount === 1 ? 'recorde' : 'recordes'}`, points: 0, color: '#E3192B', icon: 'medal', share: false }), 700); }
    $('[data-spub]', el).onclick = () => composePost({ sport: 'musculacao', activity: a });
    $('[data-shome]', el).onclick = () => Nav.go('home');
    $('[data-sdel]', el).onclick = async () => { if (await confirmDialog('Excluir este treino?', 'Ele sai do histórico, das estatísticas e dos desafios. Não dá para desfazer.', 'Excluir', true)) { try { await API.removeActivity(a.id); toast('Treino excluído', 'trash'); Nav.back(); } catch (x) { toast(errMsg(x), 'x'); } } };
  },
};
const _activitySheet = activitySheet;
activitySheet = a => a && isLift(a) && (a.sets || a.plan) && !a.manual ? Nav.push('liftSummary', { id: a.id }) : _activitySheet(a);

/* ---------- histórico ---------- */
Screens.liftHistory = {
  render() {
    setAccent('musculacao'); const L = API.acts.filter(isLift);
    const groups = L.reduce((m, a) => { const k = new Date(a.startedAt).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); (m[k] = m[k] || []).push(a); return m; }, {});
    const mxV = Math.max(1, ...L.map(a => a.volume || 0));
    return `<div class="topbar solid"><button class="icon-btn glass" data-back aria-label="Voltar">${icon('back', 20, 2)}</button><div class="title">Histórico</div><span style="width:46px"></span></div>
    <div class="scroll fx-scope"><div class="pad page" style="padding-top:calc(var(--safe-top) + 74px);max-width:760px">

      ${L.length ? Object.entries(groups).map(([m, A2]) => `<div class="wsec" style="margin-top:22px"><h2>${m.charAt(0).toUpperCase() + m.slice(1)}</h2><span class="fx-m">${A2.length}</span></div><div class="stack" style="gap:10px">${A2.map(a => `<button class="fx-glass fx-hrow press" data-hs="${a.id}"><div class="fx-hday"><b>${new Date(a.startedAt).getDate()}</b><span>${WD3[new Date(a.startedAt).getDay()]}</span></div><div style="flex:1;min-width:0;text-align:left"><div class="h3" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.title || 'Musculação')}${a.prCount ? ` <span style="color:#E3192B">${icon('medal', 13, 2.4)}</span>` : ''}</div><div class="fx-m" style="margin-top:3px">${hms(a.duration || 0)} · ${(a.sets || []).length} séries${a.difficulty != null ? ' · intensidade ' + a.difficulty : ''}</div><div class="fx-hbar"><i style="width:${(a.volume || 0) / mxV * 100}%"></i></div></div><div style="text-align:right"><b class="num" style="font-size:15px">${volStr(a.volume)}</b><div class="fx-m" style="font-size:10.5px">volume</div></div></button>`).join('')}</div>`).join('')
        : `<div style="margin-top:20px">${emptyBox('Nenhum treino ainda. Inicie uma ficha e conclua as séries para ver o histórico aqui.')}</div>`}
      <div style="height:40px"></div></div></div>`;
  },
  mount(el) { el.addEventListener('click', e => { const b = e.target.closest('[data-hs]'); if (!b) return; const a = API.acts.find(x => x.id === b.dataset.hs); if (a && (a.sets || a.plan) && !a.manual) Nav.push('liftSummary', { id: a.id }); else _activitySheet(a); }); },
  onReturn(el) { el.innerHTML = Screens.liftHistory.render(); Screens.liftHistory.mount(el); },
};

</script>
<script>
/* ============================================================
   ORA GYM — Corrida (e pedal): GPS real com modos (livre, distância,
   tempo, intervalado), voz em português, pausa automática, corrida
   em andamento que sobrevive a recarregar, resumo com mapa, parciais,
   melhores marcas e controle de tênis.
   ============================================================ */
const RUN_C = '#D4FF3A';
const isRunAct = a => a && (a.sport === 'corrida' || a.sport === 'ciclismo');
const km2 = m => fmt((m || 0) / 1000, 2);
const kmStr = m => { const k = (m || 0) / 1000; return fmt(k, k >= 100 ? 0 : k >= 10 ? 1 : 2); };
const RUN_MODES = { free: 'Livre', dist: 'Distância', time: 'Tempo', int: 'Intervalado' };
const runPrefs = () => ({ voice: true, auto: true, ...(Store.get().runPrefs || {}) });
const setRunPrefs = p => Store.set({ runPrefs: { ...runPrefs(), ...p } });

/* ---------- mapa base sem chave de API: OpenStreetMap escurecido; se falhar, Esri ---------- */
function baseTiles(m) {
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap', className: 'rx-tiles' });
  let errs = 0, swapped = false;
  osm.on('tileerror', () => { if (swapped || ++errs < 3) return; swapped = true; m.removeLayer(osm);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Mapa © Esri', className: 'rx-tiles' }).addTo(m); });
  osm.on('tileload', () => { errs = 0; });
  osm.addTo(m); return osm;
}

/* ---------- voz ---------- */
const Voice = {
  say(t) { if (!runPrefs().voice || !('speechSynthesis' in window)) return; try { const u = new SpeechSynthesisUtterance(t); u.lang = 'pt-BR'; u.rate = 1.04; const v = speechSynthesis.getVoices().find(x => /pt(-|_)BR/i.test(x.lang)); if (v) u.voice = v; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} },
  dur(s) { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return [h ? `${h} ${h > 1 ? 'horas' : 'hora'}` : '', m ? `${m} ${m > 1 ? 'minutos' : 'minuto'}` : '', x && !h ? `${x} segundos` : ''].filter(Boolean).join(' e ') || '0 segundos'; },
  pace(secPerKm) { const m = Math.floor(secPerKm / 60), s = Math.round(secPerKm % 60); return `${m} e ${String(s).padStart(2, '0')} por quilômetro`; },
};

/* ---------- melhores marcas a partir das parciais ---------- */
const EFFORTS = [[1, '1 km'], [5, '5 km'], [10, '10 km'], [21, '21 km']];
function bestWindow(splits, k) { if (!splits || splits.length < k) return null; let s = 0, best = Infinity; for (let i = 0; i < splits.length; i++) { s += splits[i]; if (i >= k) s -= splits[i - k]; if (i >= k - 1 && s < best) best = s; } return best; }
function effortOf(a, k) { const w = bestWindow(a.splits, k); if (w) return w; const d = (a.distance || 0) / 1000; if (d >= k * .99 && d <= k * 1.03 && a.duration) return a.duration * (k / d); return null; }
function runRecords(acts) {
  const R = acts.filter(a => a.sport === 'corrida' && a.distance > 0 && a.duration > 0);
  const out = EFFORTS.map(([k, l]) => { let best = null; R.forEach(a => { const t = effortOf(a, k); if (t && (!best || t < best.t)) best = { t, a }; }); return { k: l, v: best ? hms(best.t) : '—', sub: best ? `${paceOf(best.t, k * 1000)}/km · ${shortDate(best.a.startedAt)}` : 'ainda sem marca', a: best && best.a }; });
  const longest = R.reduce((b, a) => !b || a.distance > b.distance ? a : b, null);
  out.push({ k: 'Mais longa', v: longest ? kmStr(longest.distance) + ' km' : '—', sub: longest ? shortDate(longest.startedAt) : 'ainda sem marca', a: longest });
  const fast = R.filter(a => a.distance >= 3000).reduce((b, a) => !b || a.duration / a.distance < b.duration / b.distance ? a : b, null);
  out.push({ k: 'Melhor pace', v: fast ? paceOf(fast.duration, fast.distance) : '—', sub: fast ? `média · ${kmStr(fast.distance)} km` : 'corridas de 3 km+', a: fast });
  return out;
}
function prsIn(a) { if (a.sport !== 'corrida') return []; const others = API.acts.filter(x => x.sport === 'corrida' && x.id !== a.id && x.startedAt < (a.startedAt || Infinity)); const out = [];
  EFFORTS.forEach(([k, l]) => { const t = effortOf(a, k); if (!t) return; const prev = others.map(x => effortOf(x, k)).filter(Boolean); if (prev.length && t < Math.min(...prev)) out.push({ l, t }); });
  if (others.length && a.distance > Math.max(...others.map(x => x.distance || 0))) out.push({ l: 'Mais longa', t: null }); return out; }

/* ---------- tênis ---------- */
const shoes = () => (API.me && API.me.shoes) || [];
const shoeKm = id => API.acts.filter(a => a.shoeId === id).reduce((s, a) => s + (a.distance || 0), 0) / 1000;
const defaultShoe = () => { const L = shoes().filter(s => !s.retired); return (L.find(s => s.def) || L[0] || null); };
function shoesSheet(done) {
  const draw = () => { const L = shoes();
    return `<h3 class="h2">Seus tênis</h3><p class="muted small" style="margin:6px 0 14px">A quilometragem soma sozinha a cada corrida. A maioria dos tênis rende de 600 a 800 km.</p>
    <div class="stack" style="gap:10px">${L.length ? L.map(s => { const k = shoeKm(s.id); const p = Math.min(1, k / (s.limit || 700)); return `<div class="rx-shoe ${s.retired ? 'off' : ''}"><div class="between"><div style="min-width:0"><div class="h3">${esc(s.name)}${s.def && !s.retired ? ' <span class="rx-tag">padrão</span>' : ''}${s.retired ? ' <span class="rx-tag">aposentado</span>' : ''}</div><div class="muted small">${fmt(k, 1)} de ${s.limit || 700} km</div></div>
      <div class="row" style="gap:6px">${!s.retired && !s.def ? `<button class="chip sm" data-sdef="${s.id}">Padrão</button>` : ''}<button class="chip sm" data-sret="${s.id}">${s.retired ? 'Reativar' : 'Aposentar'}</button></div></div><div class="rx-bar ${p >= .9 ? 'warn' : ''}"><i style="width:${p * 100}%"></i></div></div>`; }).join('') : '<p class="muted small">Nenhum tênis cadastrado.</p>'}</div>
    <div class="grid2" style="margin-top:16px;grid-template-columns:minmax(0,2fr) minmax(0,1fr)"><div class="field"><label for="sh-n">Novo tênis</label><input class="input" id="sh-n" placeholder="Ex.: Pegasus 41" maxlength="40"></div><div class="field"><label for="sh-l">Limite (km)</label><input class="input" id="sh-l" type="number" inputmode="numeric" value="700" min="100"></div></div>
    <button class="btn btn-white btn-block" data-sadd>${icon('plus', 16)}Adicionar tênis</button>`; };
  Sheet.open(`<div class="rx-shoes">${draw()}</div>`, (w) => { const root = $('.rx-shoes', w);
    const save = async L => { try { await API.updateProfile({ shoes: L }); root.innerHTML = draw(); done && done(); } catch (x) { toast(errMsg(x), 'x'); } };
    root.addEventListener('click', async e => {
      if (e.target.closest('[data-sadd]')) { const n = $('#sh-n', root).value.trim(); if (!n) return toast('Dê um nome ao tênis', 'x'); const lim = Math.max(100, Math.round(+$('#sh-l', root).value || 700)); const L = shoes().map(s => ({ ...s })); L.push({ id: 's' + Date.now().toString(36), name: n, limit: lim, def: !L.some(s => s.def && !s.retired), retired: false, added: Date.now() }); await save(L); toast('Tênis adicionado'); }
      const d = e.target.closest('[data-sdef]'); if (d) await save(shoes().map(s => ({ ...s, def: s.id === d.dataset.sdef })));
      const r = e.target.closest('[data-sret]'); if (r) await save(shoes().map(s => s.id === r.dataset.sret ? { ...s, retired: !s.retired, def: s.retired ? s.def : false } : s));
    }); }, { label: 'Tênis' });
}

/* ============================================================
   Espaço da corrida
   ============================================================ */
let runPick = { mode: 'free', target: 0 };
const PRESETS = [['free', 0, 'Livre'], ['dist', 5, '5 km'], ['dist', 10, '10 km'], ['time', 30, '30 min'], ['int', 6, 'Intervalado']];
function weekDays(acts) { const t = noon(new Date()); const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); const k = dayKey(d); const m = acts.filter(a => a.sport === 'corrida' && dayKey(new Date(a.startedAt)) === k).reduce((s, a) => s + (a.distance || 0), 0); return { d, m, today: k === dayKey(t), fut: d > t }; }); }
WORLD.corrida = (sp, S) => {
  const runs = API.acts.filter(a => a.sport === 'corrida'); const wd = weekDays(API.acts); const wk = wd.reduce((s, x) => s + x.m, 0); const g = S.goal; const tgt = g.kind === 'metric' ? g.target : null;
  const wkRuns = runs.filter(a => a.startedAt >= wd[0].d.getTime() - 12 * 3600e3); const wkTime = wkRuns.reduce((s, a) => s + (a.duration || 0), 0);
  const mx = Math.max(1, ...wd.map(x => x.m)); const L = runs[0]; const recs = runRecords(API.acts); const sh = shoes().filter(s => !s.retired);
  const wn = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7); })();
  return `<div class="rx-hero"><div class="hero-stack" style="position:absolute;inset:0" data-e="0" data-ek="zoom">${scene('corrida', 'corrida', { eager: true, i: 1, fade: 'background:linear-gradient(180deg,rgba(6,8,6,.55),rgba(6,8,6,.15) 35%,rgba(6,8,6,.55) 62%,#060806 97%)' })}</div><div class="rx-grain"></div>
    <div class="rx-hero-in"><div class="rx-kick" data-e="1"><span>SEMANA ${wn}</span><i></i>${wd[0].d.getDate()}–${wd[6].d.getDate()} ${wd[6].d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '')}</div>
      <div class="rx-big" data-e="2"><b class="num">${kmStr(wk)}</b><span>km${tgt ? `<em>/ ${tgt}</em>` : ''}</span></div>
      ${tgt ? `<button class="rx-goal" data-goal data-e="3" aria-label="Meta semanal de ${tgt} km"><i style="--p:${Math.min(1, wk / 1000 / tgt)}"></i><span>${wk / 1000 >= tgt ? 'Meta da semana batida' : `faltam ${fmt(Math.max(0, tgt - wk / 1000), 1)} km para a meta`}</span></button>` : `<button class="rx-goal" data-goal data-e="3"><span>Definir meta semanal em km</span></button>`}
      <div class="rx-sub" data-e="3">${wkRuns.length} ${wkRuns.length === 1 ? 'corrida' : 'corridas'}<i></i>${hms(wkTime)}${wk > 0 ? `<i></i>${paceOf(wkTime, wk)}/km` : ''}</div>
      <div class="rx-week" data-e="4">${wd.map(x => `<div class="${x.today ? 'today' : ''} ${x.fut ? 'fut' : ''}"><span style="--h:${x.m ? Math.max(.12, x.m / mx) : 0}"><i></i></span><b>${x.m ? fmt(x.m / 1000, x.m >= 10000 ? 0 : 1) : ''}</b><em>${WD1[x.d.getDay()]}</em></div>`).join('')}</div>
    </div></div>
  <div class="pad"><div class="wgrid">
   <div>
    <div class="rx-start" data-e="5"><div class="rx-k">Próxima corrida</div><div class="rx-modes">${PRESETS.map(([m, t, l]) => `<button class="${runPick.mode === m && (m !== 'dist' && m !== 'time' || runPick.target === t) ? 'on' : ''}" data-rpick="${m},${t}">${l}</button>`).join('')}<button data-rcustom>${icon('edit', 14)}</button></div>
      <button class="rx-go press" data-push="runLive" data-params='${JSON.stringify({ id: 'corrida', ...runPick })}'><span>${icon('play', 26)}</span><b>Correr</b><em>${runPick.mode === 'free' ? 'sem meta' : runPick.mode === 'dist' ? `meta ${runPick.target} km` : runPick.mode === 'time' ? `meta ${runPick.target} min` : intervalLabel(runPick)}</em></button>
      <button class="rx-manual" data-push="manualAct" data-params='{"id":"corrida"}'>${icon('edit', 14)}Registrar corrida feita sem o app</button></div>
    ${L ? `<button class="rx-last press" data-runopen="${L.id}" data-e="6"><div class="rx-last-map">${L.route && L.route.length > 1 ? routeSVG(L.route, { color: RUN_C }) : `<div class="rx-nomap">${icon('run', 28)}</div>`}</div>
        <div class="rx-last-in"><div class="rx-k">Última corrida · ${shortDate(L.startedAt)}</div><div class="h2" style="margin-top:4px;font-size:19px">${esc(L.title || 'Corrida')}</div>
        <div class="rx-tri"><div><b class="num">${km2(L.distance)}</b><span>km</span></div><div><b class="num">${paceOf(L.duration, L.distance)}</b><span>/km</span></div><div><b class="num">${hms(L.duration)}</b><span>tempo</span></div></div></div></button>`
      : `<div class="rx-glass" style="text-align:center;padding:26px 18px" data-e="6"><div class="rx-k" style="justify-content:center">Comece do zero</div><div class="h2" style="font-size:20px;margin-top:8px">Sua primeira corrida</div><p class="muted small" style="margin:8px 0 0;line-height:1.5">Toque em Correr, espere o GPS ficar forte e mantenha a tela ligada durante a atividade.</p></div>`}
    <div class="wsec" data-e="7"><h2>Melhores marcas</h2></div>
    <div class="rx-recs" data-e="8">${recs.map(r => `<button class="rx-rec ${r.a ? 'press' : 'empty'}" ${r.a ? `data-runopen="${r.a.id}"` : ''}><span>${r.k}</span><b class="num">${r.v}</b><em>${r.sub}</em></button>`).join('')}</div>
   </div>
   <div>

    this.stage.appendChild(this.base);

    this.edgeSwipe(); this.ready = true;
  },
  buildSide() {
    const me = API.me;
    this.side.innerHTML = `<div class="sn-brand">${brandLockup(26)}</div>
      <button class="btn btn-accent btn-block sn-cta" data-tab="train">${icon('bolt', 18, 2)}Treinar agora</button>
      <nav class="sn-nav" aria-label="Navegação principal">${TABS.map(([id, l, ic]) => `<button class="sn-item" data-tab="${id}">${icon(ic, 21, 1.8)}<span>${l}</span></button>`).join('')}
        <button class="sn-item" data-snotifs>${icon('bell', 21, 1.8)}<span>Notificações</span><span class="sn-badge" data-notif-count hidden></span></button></nav>
      <div class="sn-sports"><div class="kicker" style="margin:0 12px 8px">Seus espaços</div>${mySports().map(id => `<button class="sn-item sm" data-push="world" data-params='{"id":"${id}"}'><span class="sn-dot" style="background:${SPORTS[id].c}"></span><span>${SPORTS[id].name}</span></button>`).join('')}</div>
      <div style="flex:1"></div>
      <div class="sn-more">${[['shop', 'bag', 'Loja'], ['music', 'music', 'Música'], ['nutrition', 'leaf', 'Alimentação']].map(([s, ic, l]) => `<button class="sn-item sm" data-push="${s}" data-params='{"id":"${mySports()[0]}"}'>${icon(ic, 18)}<span>${l}</span></button>`).join('')}</div>
      <button class="sn-me" data-tab="profile">${meAv()}<div style="min-width:0;text-align:left"><div class="h3" style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(me.name)}</div><div class="muted small">@${esc(me.handle)}</div></div><span class="icon-btn" data-push="settings" aria-label="Configurações" style="margin-left:auto;width:36px;height:36px">${icon('settings', 18)}</span></button>`;
    hydrateImages(this.side); this.markSide();

  },
  markSide() { $$('.sn-item[data-tab]', this.side).forEach(b => { const on = b.dataset.tab === this.tab; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false'); }); },
  placeInd(anim) {

    if (!b) { ind.style.opacity = 0; return; }
    const r = b.getBoundingClientRect(), br = bar.getBoundingClientRect(); const x = r.left - br.left + 4, w = r.width - 8; const to = `translateX(${x}px)`;

  },
  clear() { this.stack.forEach(l => { const sc = Screens[l.id]; sc.unmount && sc.unmount(l.el); l.el.remove(); }); this.stack = []; },
  go(tab, params = {}) {

    const dir = idx >= prevIdx ? 1 : -1; const pane = $('#pane');

    const kids = [...pane.children]; const old = kids.pop() || null; kids.forEach(k => { const sc0 = Screens[k.dataset.tab]; sc0 && sc0.unmount && sc0.unmount(k); k.remove(); });

    this.placeInd(true); this.markSide();

    if (old) {

      setTimeout(rm, 450);
      if (!same) A(el, [{ opacity: 0, transform: `translateX(${dir * 50}px)` }, { opacity: 1, transform: 'none' }], { spring: [170, 22] });
    }
    sc.mount && sc.mount(el, params);
    Motion.enter(el, old ? 90 : 0);
    if (location.hash !== '#' + tab) history.replaceState(null, '', location.pathname + location.search + '#' + tab);
    document.title = `${TABS.find(t => t[0] === tab)[1]} · OraGym`;
  },
  refresh() { const el = $('#pane').lastElementChild; if (!el) return; const sc = Screens[this.tab]; const y = ($('.scroll', el) || {}).scrollTop || 0; el.innerHTML = sc.render({}); el._postsWired = false; sc.mount && sc.mount(el, {}); Motion.enter(el, 0, 30); const s2 = $('.scroll', el); if (s2) s2.scrollTop = y; if (this.side.innerHTML) this.buildSide(); },
  push(id, params = {}, opts = {}) {

    el.innerHTML = sc.render(params); this.stage.appendChild(el);
    const under = this.stack.length ? this.stack[this.stack.length - 1].el : this.base;

/* Cabeçalho que fica sólido ao rolar + parallax do herói */
function bindScrollFx(root, { bar, hero, threshold = 220 } = {}) {
  const sc = $('.scroll', root); if (!sc) return; let tick = false;
  const run = () => { tick = false; const y = sc.scrollTop;
    if (bar) bar.classList.toggle('solid', y > threshold);
    if (hero) { hero.style.transform = `translate3d(0,${y * .45}px,0) scale(${1 + Math.max(0, -y) / 600})`; hero.style.opacity = clamp(1 - y / 520, 0, 1); }
  };
  sc.addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(run); } }, { passive: true });
}

/* Ações delegadas: data-back / data-push / data-gotab */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-back],[data-push],[data-gotab]'); if (!b || !Nav.ready || !$('#app').contains(b) || b.closest('.ob')) return;
  if (b.hasAttribute('data-back')) { haptic(6); Nav.back(); return; }
  if (b.dataset.gotab) { Nav.go(b.dataset.gotab); return; }
  if (b.dataset.push) { e.stopPropagation(); haptic(8); let p = {}; try { p = JSON.parse(b.dataset.params || '{}'); } catch (x) {} const sw = b.closest('.sheet-wrap'); if (sw) { const bd = $('.sheet-backdrop', sw); bd && bd.click(); } Nav.push(b.dataset.push, p, { from: b.hasAttribute('data-expand') ? b : null }); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Nav.stack.length && !$('.sheet-wrap') && !$('.celebrate')) { const top = Nav.stack[Nav.stack.length - 1]; if (!Screens[top.id].noSwipe) Nav.back(); } });

function brandLockup(s = 28) { return `<img src="photos/brand/logo.png" alt="OraGym" style="height:${s}px;width:auto;display:block">`; }

/* ---------- Sessão ---------- */
function splash(text = '') {
  let s = $('.boot'); if (!s) { s = document.createElement('div'); s.className = 'boot'; $('#app').appendChild(s); }
  s.innerHTML = `<div style="text-align:center">${brandLockup(34)}<div class="spinner" style="margin:26px auto 0"></div>${text ? `<p class="muted small" style="margin-top:16px">${esc(text)}</p>` : ''}</div>`; return s;
}
const unsplash = () => { const s = $('.boot'); if (s) A(s, [{ opacity: 1 }, { opacity: 0 }], { duration: 300 }).finished.then(() => s.remove()); };

function enterApp() {
  $$('.ob').forEach(o => { if (!o._leaving) { o._leaving = true; A(o, [{ opacity: 1 }, { opacity: 0 }], { duration: 500 }).finished.then(() => o.remove()); } });
  document.body.classList.add('authed'); Nav.buildSide();
  const h = location.hash.slice(1); Nav.go(TABS.some(t => t[0] === h) ? h : 'home');
  const inv = sessionStorage.getItem('oragym.invite'); if (inv) { sessionStorage.removeItem('oragym.invite'); setTimeout(() => Nav.push('challenge', { id: inv }), 400); }
  refreshNotifDot(); clearInterval(enterApp._iv); enterApp._iv = setInterval(() => document.visibilityState === 'visible' && refreshNotifDot(), 60000);
}
function leaveApp() { document.body.classList.remove('authed'); clearInterval(enterApp._iv); Nav.clear(); $('#pane').innerHTML = ''; Nav.side.innerHTML = ''; $$('.sheet-wrap,.celebrate').forEach(x => x.remove()); }

function setupNeeded(mode) {
  $('#app').innerHTML = `<div class="boot" style="padding:24px"><div style="max-width:520px;text-align:left">${brandLockup(30)}<h1 class="display" style="font-size:30px;margin:24px 0 10px">${mode === 'error' ? 'Não foi possível conectar' : 'Conecte o Firebase'}</h1>
    <p class="muted" style="line-height:1.6">${mode === 'error' ? 'Verifique sua conexão com a internet e recarregue a página.' : 'Este app ainda não tem as credenciais do projeto Firebase. Cole o objeto <code>firebaseConfig</code> do console do Firebase em <code>src/config.js</code>, gere o build e publique novamente.'}</p>
    <button class="btn btn-white" style="margin-top:18px" onclick="location.reload()">Recarregar</button></div></div>`;
}

(async function boot() {
  if (Store.get().reduced) Motion.setReduced(true);
  const q = new URLSearchParams(location.search); const inv = q.get('desafio'); if (inv) { sessionStorage.setItem('oragym.invite', inv); q.delete('desafio'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash); }
  splash();
  try { await Photos.load(); } catch (e) {}
  setAccent('brand');
  const mode = await API.init().catch(() => 'error');

  Nav.init();
  let first = true, seq = 0;
  API.auth.onChange(async u => {
    const my = ++seq;

    splash();
    try { const me = await API.loadSession(u); if (my !== seq) return; unsplash(); first = false;
      if (me._new) startSetup(); else enterApp();
    } catch (x) { if (my !== seq) return; splash(errMsg(x)); const s = $('.boot'); s.insertAdjacentHTML('beforeend', `<div style="position:absolute;bottom:40px;left:0;right:0;text-align:center"><button class="btn btn-white btn-sm" onclick="location.reload()">Tentar de novo</button> <button class="btn btn-ghost btn-sm" id="boot-out">Sair</button></div>`); $('#boot-out').onclick = () => API.auth.signOut(); }
  });
